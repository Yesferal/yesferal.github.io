<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>HornsApp</title>
  <meta name="description" content="HornsApp — live music near you: concerts and upcoming shows."/>
  <link rel="canonical" href="https://yesferal.com/hornsapp/"/>

  <meta property="og:title" content="HornsApp"/>
  <meta property="og:description" content="Live music near you — find concerts and upcoming shows."/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://yesferal.com/hornsapp/"/>
  <meta property="og:image" content="https://yesferal.com/images/hornsapp.png"/>

  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <script>
    (function () {
      const stored = localStorage.getItem("theme");
      const theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app-landing.css">
</head>

<body class="app-landing app-landing-horns">

  <nav class="nav">
    <a class="nav-brand" href="/">Yesferal</a>
    <div class="nav-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>
  </nav>

  <div class="app-landing-main">
  <main class="app-stage">
    <img class="app-icon" src="/images/hornsapp.png" alt="HornsApp">
    <h1 class="app-brand">HornsApp</h1>
    <p class="app-lead">Live music near you — find concerts, follow upcoming shows, and never miss a night that matters.</p>

    <div class="app-actions">
      <a class="btn play" href="https://play.google.com/store/apps/details?id=com.yesferal.hornsapp">
        Get on Google Play
      </a>
    </div>
    <p class="app-more">
      <a href="/hornsapp/best/album/">Album rankings by year</a>
    </p>
  </main>
  </div>

  <script src="/theme.js"></script>
</body>
</html>
