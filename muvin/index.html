<!DOCTYPE html>
<html lang="en">
<head>

  <meta property="og:title" content="Muvin"/>

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <script>
    (function () {
      const stored = localStorage.getItem("theme");
      const theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app-landing.css">
</head>

<body class="app-landing app-landing-muvin">

  <nav class="nav">
    <a class="nav-brand" href="/">Yesferal</a>
    <div class="nav-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>
  </nav>

  <div class="app-landing-main">
  <main class="app-stage">
    <img class="app-icon" src="/images/muvin.png" alt="Muvin">
    <h1 class="app-brand">Muvin</h1>
    <p class="app-lead">Discover what’s on near you — culture, food, sports, theater, and nights out beyond the big concert circuit.</p>

    <div class="app-actions">
      <a class="btn play" href="https://play.google.com/store/apps/details?id=com.yesferal.muvin">
        Get on Google Play
      </a>
    </div>
  </main>
  </div>

  <script src="/theme.js"></script>
</body>
</html>
